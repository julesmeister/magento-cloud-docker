services:
  web:
    image: nginx:1.24-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - fpm
    networks:
      - magento

  fpm:
    build:
      context: ./docker/magento-php
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html:delegated
    environment:
      - PHP_MEMORY_LIMIT=2G
    networks:
      - magento

  db:
    image: mariadb:10.6
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=magento2
      - MYSQL_DATABASE=magento2
      - MYSQL_USER=magento2
      - MYSQL_PASSWORD=magento2
    volumes:
      - magento-db:/var/lib/mysql
    networks:
      - magento

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    networks:
      - magento

  elasticsearch:
    image: elasticsearch:7.17.9
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - magento-elasticsearch:/usr/share/elasticsearch/data
    networks:
      - magento

  # Vector database for AI search
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    networks:
      - magento

  # AI Search API service - simplified Python service
  ai-search-api:
    image: python:3.11-slim
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CHROMA_URL=http://chromadb:8000
    depends_on:
      - chromadb
    volumes:
      - ./app/code/Custom/AiSearch:/app
    working_dir: /app
    command: bash -c "pip install flask requests chromadb openai google-generativeai && echo 'Starting AI Search API...' && python ai_search_api.py"
    networks:
      - magento

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - magento

volumes:
  magento-db:
  magento-elasticsearch:
  chroma-data:

networks:
  magento:
    driver: bridge